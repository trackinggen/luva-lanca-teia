<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seu pedido — Luva Lança-Teia Infantil</title><style>body{margin:0;background:#f5f5f5;font:16px system-ui;color:#171717}main{max-width:460px;margin:12vh auto;padding:32px;background:white;border-radius:18px;text-align:center}a{color:#047857}p{line-height:1.6}</style></head><body><main><h1 id="title">Consultando pagamento…</h1><p id="detail">Aguarde enquanto confirmamos o status do Pix.</p><a href="/">Voltar à loja</a></main><script>(async function(){var title=document.getElementById('title'),detail=document.getElementById('detail');try{var id=localStorage.getItem('lastPixTx');if(!id)throw Error();var response=await fetch('/api/public/pix/status?id='+encodeURIComponent(id),{cache:'no-store'});var data=await response.json();if(!response.ok)throw Error();if(data.status==='paid'){title.textContent='Pagamento confirmado!';detail.textContent='Recebemos seu Pix. Não é necessário pagar taxas adicionais para confirmar esta compra.';}else{title.textContent='Pagamento ainda não confirmado';detail.textContent='Se você acabou de pagar, aguarde alguns instantes e atualize esta página.';}}catch(e){title.textContent='Consulte seu pedido';detail.textContent='Não foi possível confirmar o pagamento agora. Volte ao checkout ou entre em contato com a loja.';}})();</script></body></html>
